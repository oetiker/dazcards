# Experiment: generate German speech with Qwen3-TTS 1.7B (MLX) on GitHub's
# macOS (Apple Silicon) runner using the Metal GPU, and commit the resulting
# samples to public/tts-lab/samples/qwen/ for listening in the voice lab.
name: TTS probe (macOS Metal)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tts-probe.yml', 'scripts/tts/**']

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -q mlx-audio lameenc soundfile
      - name: Metal check
        run: python -c "import mlx.core as mx; print('device', mx.default_device(), 'metal', mx.metal.is_available())"
      - name: Generate samples
        run: python scripts/tts/qwen_probe.py public/tts-lab/samples/qwen
      - name: Commit samples
        run: |
          rm -f public/tts-lab/samples/qwen/ref-*.wav
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tts-lab/samples/qwen
          git commit -m "Add Qwen3-TTS probe samples (generated on macOS runner)" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
