[package]
name = "dazcards"
version = "0.1.0"
description = "Picture and audio language games for children learning German (DaZ)"
authors = ["DaZ Cards contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "dazcards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
